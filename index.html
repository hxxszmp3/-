var singerAlias={'黄丽玲':'A-LIN','G.E.M.':'邓紫棋','G.E.M':'邓紫棋'};

// ===== 全局工具 + 搜索索引(性能优化:预计算 clean 字段,避免每次搜索 1.4 万条全量 replace) =====
function cleanStr(s){return s.replace(/[^a-z0-9一-鿿]/gi,'').toLowerCase();}
var _songFlat = [];
var _singerCleanCache = {};
var _renderShown = 0;
var _renderCache = null;
(function buildSongIndex(){
  var keys = Object.keys(songDB);
  for (var i=0;i<keys.length;i++){
    var singer = keys[i];
    var cs = cleanStr(singer);
    _singerCleanCache[singer] = cs;
    var songs = songDB[singer];
    for (var j=0;j<songs.length;j++){
      _songFlat.push({name:songs[j].name,cover:songs[j].cover,quark:songs[j].quark,singer:singer,cname:cleanStr(songs[j].name),csinger:cs});
    }
  }
})();

// ===== 通用搜索匹配(单曲搜索 + 批量下载共用同一套规则) =====
function _matchQuery(query){
  var qc = cleanStr(query);
  // 多关键词拆分(空格分隔),类QQ音乐
  var keywords = query.split(/\s+/).filter(function(k){ return k.length > 0; }).map(function(k){ return cleanStr(k); });
  // 判断是否搜歌手:任意关键词精确匹配歌手名(支持"晴天 周杰伦"顺序)
  var singerMatch = null;
  if (qc.length >= 2) {
    var singerKeys = Object.keys(songDB);
    // 优先匹配纯歌手(不含&),避免"EXO"被"EXO&xx"合唱误匹配(韩文/符号被clean掉导致重名)
    for (var si = 0; si < singerKeys.length; si++) {
      if (singerKeys[si].indexOf('&') !== -1) continue;
      var csk = _singerCleanCache[singerKeys[si]];
      for (var ki = 0; ki < keywords.length; ki++) {
        if (csk === keywords[ki]) { singerMatch = csk; break; }
      }
      if (singerMatch) break;
    }
    // 再匹配合唱(含&)
    if (!singerMatch) {
      for (var si2 = 0; si2 < singerKeys.length; si2++) {
        if (singerKeys[si2].indexOf('&') === -1) continue;
        var csk2 = _singerCleanCache[singerKeys[si2]];
        for (var ki2 = 0; ki2 < keywords.length; ki2++) {
          if (csk2 === keywords[ki2]) { singerMatch = csk2; break; }
        }
        if (singerMatch) break;
      }
    }
    // 别名匹配(中文名→规范名，如 黄丽玲→A-LIN)
    if (!singerMatch) {
      var aliasKeys = Object.keys(singerAlias);
      for (var ai = 0; ai < aliasKeys.length; ai++) {
        var aClean = cleanStr(aliasKeys[ai]);
        for (var ki3 = 0; ki3 < keywords.length; ki3++) {
          if (aClean === keywords[ki3]) {
            var target = singerAlias[aliasKeys[ai]];
            singerMatch = _singerCleanCache[target] || cleanStr(target);
            keywords[ki3] = singerMatch; // 把别名关键词替换成规范名，让评分能匹配到该歌手
            break;
          }
        }
        if (singerMatch) break;
      }
    }
  }
  var results = [];
  var seen = {};
  for (var i = 0; i < _songFlat.length; i++) {
    var it = _songFlat[i];
    if (singerMatch && it.csinger !== singerMatch) continue;
    var score = _scoreSong(it, keywords);
    if (score < 0) continue;
    var key = it.singer + '||' + it.name;
    if (!seen[key]) {
      seen[key] = true;
      results.push({ name: it.name, cover: it.cover, quark: it.quark, singer: it.singer, score: score });
    }
  }
  // 相关度排序:分数降序,同分按歌手热度
  results.sort(function(a, b) {
    if (a.score !== b.score) return b.score - a.score;
    var pa = singerPopularity[a.singer] || 0, pb = singerPopularity[b.singer] || 0;
    return pa !== pb ? pb - pa : 0;
  });
  return results;
}

function batchSearch(){
  var raw=document.getElementById('batchInput').value.trim();
  if(!raw){showToast('请输入歌名');return;}
  var lines=raw.split('\n').filter(function(n){return n.trim().length>0});
  var container=document.getElementById('batchResults');
  if(lines.length===0){container.innerHTML='';return;}
  var foundSongs=[],notFound=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    // Strip leading number/serial: "1 歌名" "99. 歌名" "123、歌名" -> "歌名"
    line=line.replace(/^\d+[\.\、\s，]+/,'').trim();
    if(!line){notFound.push(lines[i].trim());continue;}
    // 一行一个,直接用单曲搜索同一套规则匹配(歌名/歌手/歌名+歌手均可)
    var results=_matchQuery(line);
    if(results.length===0){notFound.push(line);}
    else{
      var top=results[0].score;
      for(var bi=0;bi<results.length;bi++){
        if(results[bi].score===top){foundSongs.push({name:results[bi].name,cover:results[bi].cover,quark:results[bi].quark,singer:results[bi].singer,query:line,score:results[bi].score,order:i});}else break;
      }
    }
  }
  // 按输入框行顺序排列,同一行内保持相关度(分数)降序
  foundSongs.sort(function(a,b){return (a.order-b.order)||(b.score-a.score);});
  var seen={},unique=[];
  for(var i=0;i<foundSongs.length;i++){
    var key=foundSongs[i].singer+'||'+foundSongs[i].name;
    if(!seen[key]){seen[key]=true;unique.push(foundSongs[i]);}
  }
  var html='<div style="margin-bottom:12px;font-size:13px;color:#999"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="flex:1">共 <b>'+lines.length+'</b> 条，匹配 <b style="color:#27ae60">'+unique.length+'</b> 首</span><button class="copy-all-btn" onclick="copySelectedLinks()">📥 批量下载（一次最多100首）</button>，<b style="color:#e74c3c">'+notFound.length+'</b> 条未找到</div><label id="selectAllWrap" style="cursor:pointer;font-size:13px;color:#d4b888;display:flex;align-items:center;gap:6px"><input type="checkbox" id="selectAllBatch" style="accent-color:#c4b0a0"> 全选 / 取消全选</label></div>';
  if(unique.length>0){
    html+='<div class="song-list">';
    for(var i=0;i<unique.length;i++){
      var s=unique[i];
      html+='<div class="song-card">'+
        (s.quark?'<div class="song-index" style="width:auto;padding:0 4px"><input type="checkbox" class="batch-cb" data-quark="'+escAttr(s.quark)+'" style="accent-color:#c4b0a0;width:16px;height:16px;cursor:pointer"></div>':'<div class="song-index" style="width:auto;padding:0 4px"></div>')+
        '<div class="song-cover">'+(s.cover?'<img src="'+s.cover+'" style="width:100%;height:100%;border-radius:10px;object-fit:cover" onerror="this.style.display=\'none\'">':'<svg viewBox="0 0 24 24" fill="none" stroke="#b8956a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><circle cx="17" cy="16" r="2.5"/><path d="M11 18V3l9-2v13"/></svg>')+'</div>'+
        '<div class="song-info">'+
          '<div class="song-name">'+escHtml(s.name)+'</div>'+
          '<div class="song-singer">'+escHtml(s.singer)+'</div>'+
        '</div>'+
        (s.quark?'<button class="download-btn" data-quark="'+escAttr(s.quark)+'" data-name="'+escAttr(s.name)+' - '+escAttr(s.singer)+'" onclick="doDownload(\''+escAttr(s.name)+'\',\''+escAttr(s.singer)+'\',\''+escAttr(s.quark)+'\')">'+
          '<span class="tooltip">夸克网盘下载</span>'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'+
        '</button>':'')+
      '</div>';
    }
    html+='</div>';
  }
  if(notFound.length>0){
    html+='<div style="margin-top:16px;padding:12px;background:#fdedec;border-radius:10px;border:1px solid #f5b7b1"><div style="font-size:13px;font-weight:600;color:#e74c3c;margin-bottom:8px">暂未收录：</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
    for(var i=0;i<notFound.length;i++)html+='<span style="padding:4px 10px;background:#fff;border-radius:6px;font-size:12px;color:#e74c3c">'+escHtml(notFound[i])+'</span>';

}

function copySelectedLinks(){
  var links=[];
  var cbs=document.querySelectorAll('.batch-cb:checked');
  for(var i=0;i<cbs.length;i++){
    var q=cbs[i].getAttribute('data-quark');
    if(q) links.push(q);
  }
  if(links.length===0){showToast('请先勾选要下载的歌曲');return;}
  var text=links.join('\n');
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  // 复制到剪贴板
  var copied=false;
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:1px;height:1px;opacity:0;z-index:99999';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,99999);
    copied=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
  if(isMobile){
    // 手机端：复制后自动打开夸克
    showToast('已复制 '+links.length+' 条，正在打开夸克...');
    setTimeout(function(){
      var w=window.open(links[0],'_blank');
      if(!w) window.location.href=links[0];
    },300);
    return;
  }
  // 电脑端：保留原逻辑
  if(copied){showToast('已复制 '+links.length+' 条链接');return;}
  var overlay=document.createElement('div');
  overlay.id='copyOverlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9998;display:flex;align-items:center;justify-content:center';
  overlay.onclick=function(){document.body.removeChild(this);};
  var box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:14px;padding:16px;width:92%;max-width:400px;max-height:70vh;overflow:auto';
  box.onclick=function(e){e.stopPropagation();};
  box.innerHTML='<div style=\"font-weight:700;margin-bottom:8px;color:#333\">📋 长按下方文字 → 全选 → 拷贝</div><textarea id=\"copyFallback\" style=\"width:100%;height:180px;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:13px\" readonly>'+text.replace(/</g,'&lt;')+'</textarea><div style=\"font-size:11px;color:#b8b0a8;margin-top:6px\">共 '+links.length+' 条链接，拷贝后夸克会自动识别</div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(function(){
    var t=document.getElementById('copyFallback');
    if(t){t.focus();t.select();}
  },200);
}

  if(singers.length===0){
    document.getElementById('singerGrid').innerHTML='<div style="color:#999;text-align:center;padding:40px">暂无歌手合集</div>';
    return;
  }
  singers.sort(function(a,b){
    var fa=getFL(a),fb=getFL(b);
    if(fa!==fb)return fa.localeCompare(fb);
    // 同字母板块内:先按小板块(单个歌手/组合/其他)分组
    var ra=getSubRank(a),rb=getSubRank(b);
    if(ra!==rb)return ra-rb;
    // 同小板块内:中文歌手在前,英文/字母歌手在后
    var ea=/[一-鿿]/.test(a)?0:1, eb=/[一-鿿]/.test(b)?0:1;
    if(ea!==eb)return ea-eb;
    // 组内按热度降序
    var pa=singerPopularity[a]||0,pb=singerPopularity[b]||0;
    if(pa!==pb)return pb-pa;
    var ca=singerSongCounts[a]||0,cb=singerSongCounts[b]||0;
    if(ca!==cb)return cb-ca;
    return a.localeCompare(b);
  });
  var groups={};
  for(var i=0;i<singers.length;i++){var fl=getFL(singers[i]);if(!groups[fl])groups[fl]=[];groups[fl].push(singers[i]);}
  _allLetters=Object.keys(groups).sort(function(a,b){
    if(a==='#')return 1;
    if(b==='#')return -1;
    return a.localeCompare(b);
  });
  _allSingers=[];
  for(var li=0;li<_allLetters.length;li++){
    var l=_allLetters[li];
    for(var si=0;si<groups[l].length;si++){
      var sn=groups[l][si];
      _allSingers.push({singer:sn,letter:l,sub:getSub(sn)});
    }
  }
  _curLetter='';
  buildPages();
  renderSingerPage();
  renderLetterNav();
  fixToolbarTop();
}
function buildPages(){
  var list = _curLetter ? _allSingers.filter(function(x){return x.letter===_curLetter;}) : _allSingers;
  _singerPages=[];
  for(var i=0;i<list.length;i+=10){_singerPages.push(list.slice(i,i+10));}
  _singerPageIdx=0;
}

// ===== 猜你想搜：编辑距离模糊匹配（打错字容错） =====
function _normName(s){return (s||'').toLowerCase().normalize('NFKC').replace(/[\s\p{P}\p{S}]+/gu,'');}
function _lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  var m=a.length,n=b.length,i,j,prev=[],cur=[];
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;var best=cur[0];
    for(j=1;j<=n;j++){
      var c=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
      if(cur[j]<best)best=cur[j];
    }
    if(best>max)return max+1;
    var t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function suggestSinger(q){
  var nq=_normName(q);
  if(!nq||nq.length<2)return null;
  var maxD=nq.length<=3?1:Math.min(3,Math.floor(nq.length/3));
  var pool=Object.keys(singerCollection);
  for(var k in singerAlias){if(singerCollection[singerAlias[k]]&&pool.indexOf(k)===-1)pool.push(k);}
  var best=null,bestD=maxD+1;
  for(var i=0;i<pool.length;i++){
    var nn=_normName(pool[i]);
    if(nn===nq){ // 归一化后完全一致(尾空格/标点差异/别名),直接作为建议
      return (singerAlias[pool[i]]&&singerCollection[singerAlias[pool[i]]])?singerAlias[pool[i]]:pool[i];
    }
    if(!nn)continue;
    // 归一化后互为子串(主搜索只比原文,这里兜底空格/标点差异)
    if(nn.indexOf(nq)>-1||nq.indexOf(nn)>-1){if(bestD>0){best=pool[i];bestD=0;}continue;}
    var d=_lev(nq,nn,maxD);
    if(d<=maxD&&(d<bestD||(d===bestD&&best&&(singerPopularity[pool[i]]||0)>(singerPopularity[best]||0)))){best=pool[i];bestD=d;}
  }
  if(best&&singerAlias[best]&&singerCollection[singerAlias[best]])best=singerAlias[best];
  return bestD<=maxD?best:null;
}
function _pickGuess(){document.getElementById('singerSearchIn').value=window._singerSuggest||'';searchSinger();}
function searchSinger(){
  var q=document.getElementById('singerSearchIn').value.trim();
  var r=document.getElementById('singerSearchMsg');
  if(!q){r.textContent='';return;}
  var singers=Object.keys(singerCollection);
  // 别名映射：中文名→规范名(如 黄丽玲→A-LIN)
  var aliasKeys=Object.keys(singerAlias);
  for(var ai=0;ai<aliasKeys.length;ai++){
    if(aliasKeys[ai].toLowerCase()===q.toLowerCase()){q=singerAlias[aliasKeys[ai]];break;}
  }
  var found=null;
  for(var i=0;i<singers.length;i++){
    if(singers[i].toLowerCase().indexOf(q.toLowerCase())!==-1){found=singers[i];break;}
  }
  if(found){
    r.textContent='';
    var letter='';
    for(var i=0;i<_allSingers.length;i++){if(_allSingers[i].singer===found){letter=_allSingers[i].letter;break;}}
    if(letter){_curLetter=letter;buildPages();updateAzActive();}
    var pageIdx=-1;
    for(var i=0;i<_singerPages.length;i++){
      for(var j=0;j<_singerPages[i].length;j++){
        if(_singerPages[i][j].singer===found){pageIdx=i;break;}
      }
      if(pageIdx>=0)break;
    }
    if(pageIdx>=0){
      _singerPageIdx=pageIdx;
      renderSingerPage();
      var el=document.getElementById('singer-row-'+encodeURIComponent(found));
      if(el){
        // 动态计算固定头部+工具栏高度,确保手机端滚动后无遮挡
        var th=document.querySelector('.top-header'),tb=document.querySelector('.singer-toolbar');
        var off=(th?th.offsetHeight:0)+(tb?tb.offsetHeight:0)+12;
        el.style.scrollMarginTop=off+'px';
        el.scrollIntoView({behavior:'smooth',block:'start'});
        el.classList.add('singer-row-flash');
        setTimeout(function(){el.classList.remove('singer-row-flash');},2400);
      }
    }else{r.textContent='未找到该歌手位置';}
  }else{
    var sug=suggestSinger(q);
    if(sug){
      window._singerSuggest=sug;
      r.innerHTML='未找到「'+escHtml(q)+'」，猜你想搜：<a href="javascript:void(0)" onclick="_pickGuess()">'+escHtml(sug)+'</a>';
    }else{
      r.textContent='未找到该歌手';
    }
  }
}

function _lev(a, b) {
  var la = a.length, lb = b.length;
  if (!la) return lb;
  if (!lb) return la;
  var prev = [];
  for (var j = 0; j <= lb; j++) prev[j] = j;
  for (var i = 1; i <= la; i++) {
    var cur = [i];
    for (var j = 1; j <= lb; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[lb];
}
function _findSuggestion(q) {
  var qc = cleanStr(q);
  if (qc.length < 2) return null;
  var best = null, bestD = 99;
  for (var i = 0; i < _songFlat.length; i++) {
    var it = _songFlat[i];
    if (Math.abs(it.cname.length - qc.length) <= 3) {
      var d = _lev(it.cname, qc);
      if (d < bestD) { bestD = d; best = it.name; }
    }
    if (Math.abs(it.csinger.length - qc.length) <= 3) {
      var d2 = _lev(it.csinger, qc);
      if (d2 < bestD) { bestD = d2; best = it.singer; }
    }
  }
  if (bestD <= 2 && best && cleanStr(best) !== qc) return best;
  return null;
}
function _scoreSong(it, keywords) {
  var full1 = it.cname + it.csinger;
  var full2 = it.csinger + it.cname;
  var total = 0;
  for (var ki = 0; ki < keywords.length; ki++) {
    var kw = keywords[ki];
    var s = 0;
    if (it.cname === kw) s = 100;
    else if (it.csinger === kw) s = 90;
    else if (full1 === kw || full2 === kw) s = 85;
    else if (it.cname.indexOf(kw) === 0) s = 80;
    else if (it.csinger.indexOf(kw) === 0) s = 70;
    else if (it.cname.indexOf(kw) !== -1) s = 60;
    else if (it.csinger.indexOf(kw) !== -1) s = 50;
    else if (it.csinger && kw.length > it.csinger.length && kw.slice(-it.csinger.length) === it.csinger && it.cname.indexOf(kw.slice(0, kw.length - it.csinger.length)) === 0) s = 75;
    else if (full1.indexOf(kw) !== -1 || full2.indexOf(kw) !== -1) s = 45;
    else {
      // 模糊匹配：容忍个别错别字（编辑距离）
      var d = 99, dl;
      if (kw.length >= 2) {
        if (it.cname.length >= 2 && Math.abs(it.cname.length - kw.length) <= 1) { dl = _lev(it.cname, kw); if (dl < d) d = dl; }
        if (it.csinger.length >= 2 && Math.abs(it.csinger.length - kw.length) <= 1) { dl = _lev(it.csinger, kw); if (dl < d) d = dl; }
      }
      if (d <= (kw.length <= 3 ? 1 : 2)) s = 40 - d * 5;
      else return -1;
    }
    total += s;
  }
  return total;
}

function renderResults(results, query) {

  if (results.length === 0 || results[0].score <= 40) suggest = _findSuggestion(query);
  function suggestHTML() {
    if (!suggest) return '';
    return '<div style="margin-bottom:10px;padding:8px 12px;background:#f0f6fa;border-radius:8px;font-size:13px;color:#6b9aae;">猜你想搜：<a href="javascript:void(0)" onclick="quickSearch(\'' + escAttr(suggest) + '\')" style="color:#6b9aae;font-weight:700;text-decoration:underline">' + escHtml(suggest) + '</a></div>';
  }

      '</div>';
    return;
  }
  var modeLabel = '&#x1F50E; 搜索「' + escHtml(query) + '」';
  container.innerHTML =
    suggestHTML() +

      '<span class="results-count">' + modeLabel + ' &middot; 共 <strong>' + results.length + '</strong> 首</span>' +
    '</div>' +

function renderMoreResults() {
  if (!_renderCache) return;
  var list = document.getElementById('songList');
  if (!list) return;
  var total = _renderCache.results.length;
  var end = Math.min(_renderShown + 50, total);
  var html = '';
  for (var i = _renderShown; i < end; i++) {
    html += songCardHTML(_renderCache.results[i], i, _renderCache.query);
  }
  list.insertAdjacentHTML('beforeend', html);
  _renderShown = end;
  var wrap = document.getElementById('loadMoreWrap');
  if (end >= total) {
    if (wrap) wrap.parentNode.removeChild(wrap);
  } else {
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'loadMoreWrap';
      wrap.style.textAlign = 'center';
      wrap.style.marginTop = '14px';
      list.parentNode.appendChild(wrap);
    }
    wrap.innerHTML = '<button class="load-more-btn" onclick="renderMoreResults()">加载更多（已显示 ' + end + ' / ' + total + ' 首）</button>';
  }
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  var ql = q.toLowerCase();
  var idx = text.toLowerCase().indexOf(ql);
  if (idx < 0) return escHtml(text);
  var out = '', t = text;
  while (idx >= 0 && ql.length > 0) {
    out += escHtml(t.substring(0, idx)) + '<span class="hl">' + escHtml(t.substring(idx, idx + ql.length)) + '</span>';
    t = t.substring(idx + ql.length);
    idx = t.toLowerCase().indexOf(ql);
  }
  out += escHtml(t);
  return out;
}

var favFolders = [];
var _pendingFav = null;
function loadFolders(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem('favFolders')||'null'); }catch(e){ saved = null; }
  if(saved && saved.length){ favFolders = saved; }
  else {
    var old = [];
    try{ old = JSON.parse(localStorage.getItem('favList')||'[]'); }catch(e){ old = []; }
    favFolders = [{name:'我的收藏', songs: old}];
    saveFolders();
  }
}
function saveFolders(){ localStorage.setItem('favFolders', JSON.stringify(favFolders)); }
function isFav(name, singer){
  for(var i=0;i<favFolders.length;i++){
    for(var j=0;j<favFolders[i].songs.length;j++){
      var s = favFolders[i].songs[j];
      if(s.name===name && s.singer===singer) return true;
    }
  }
  return false;
}
function removeFromAllFolders(name, singer){
  for(var i=0;i<favFolders.length;i++){
    favFolders[i].songs = favFolders[i].songs.filter(function(s){ return !(s.name===name && s.singer===singer); });
  }
  saveFolders();
}
function addToFolder(idx, name, singer, quark, cover){
  if(!favFolders[idx]) return;
  favFolders[idx].songs.unshift({name:name, singer:singer, quark:quark, cover:cover});
  saveFolders();
}
function refreshFavButtons(){
  var btns = document.querySelectorAll('.fav-btn');
  for(var i=0;i<btns.length;i++){
    var b = btns[i];
    var k = b.getAttribute('data-k');
    if(!k) continue;
    var parts = decodeURIComponent(k).split('||');
    var f = isFav(parts[0], parts[1]);
    b.textContent = f ? '★' : '☆';
    b.classList.toggle('fav-on', f);
  }
}
function toggleFav(name, singer, quark, cover, btn){
  if(isFav(name, singer)){
    removeFromAllFolders(name, singer);
    showToast('已取消收藏');
    refreshFavButtons();
    renderFavBadge();
    return;
  }
  _pendingFav = {name:name, singer:singer, quark:quark, cover:cover};
  if(favFolders.length === 1){
    addToFolder(0, name, singer, quark, cover);
    showToast('⭐ 已收藏到「' + favFolders[0].name + '」');
    refreshFavButtons();
    renderFavBadge();
    return;
  }
  showFolderPicker();
}
function showFolderPicker(){
  var html = '<div class="fpmask" onclick="closeFolderPicker()"><div class="fppanel" onclick="event.stopPropagation()">';
  html += '<div class="fptitle">选择收藏夹</div>';
  for(var i=0;i<favFolders.length;i++){
    html += '<div class="fpitem" onclick="pickFolder('+i+')"><span>'+escHtml(favFolders[i].name)+'</span><span class="fpcount">'+favFolders[i].songs.length+' 首</span></div>';
  }
  html += '<div class="fpnew" onclick="promptNewFolder()">＋ 新建收藏夹</div>';

  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeFolderPicker(){
  var m = document.querySelector('.fpmask');
  if(m) m.remove();
}
function pickFolder(idx){
  if(_pendingFav){
    addToFolder(idx, _pendingFav.name, _pendingFav.singer, _pendingFav.quark, _pendingFav.cover);
    showToast('⭐ 已收藏到「' + favFolders[idx].name + '」');
    _pendingFav = null;
  }
  closeFolderPicker();
  refreshFavButtons();
  renderFavBadge();
}
function promptNewFolder(){
  var name = prompt('请输入新收藏夹名称：');
  if(!name || !name.trim()){ closeFolderPicker(); return; }
  name = name.trim();
  favFolders.push({name:name, songs:[]});
  saveFolders();
  if(_pendingFav){
    addToFolder(favFolders.length-1, _pendingFav.name, _pendingFav.singer, _pendingFav.quark, _pendingFav.cover);
    showToast('⭐ 已收藏到「' + name + '」');
    _pendingFav = null;
  }
  closeFolderPicker();
  refreshFavButtons();
  renderFavBadge();
}
function renderFavBadge(){
  var total = 0;
  for(var i=0;i<favFolders.length;i++) total += favFolders[i].songs.length;
  var el = document.getElementById('favBadge');
  if(el) el.textContent = total > 0 ? '（' + total + '）' : '';
}
function renderFavs(){
  var container = document.getElementById('resultsContainer');
  var html = '<div class="fav-mgr">';
  html += '<div class="fav-mgr-head"><span class="fav-mgr-title">⭐ 我的收藏夹</span><button class="fav-new-btn" onclick="createFolder()">＋ 新建收藏夹</button></div>';

    html += '<div class="empty-state"><div class="empty-icon">⭐</div><p>还没有收藏夹，点「＋ 新建收藏夹」创建</p></div>';
  }
  for(var i=0;i<favFolders.length;i++){
    var f = favFolders[i];
    html += '<div class="fav-folder"><div class="fav-folder-head" onclick="toggleFolder('+i+')">';
    html += '<span class="fav-folder-name">📁 ' + escHtml(f.name) + '</span>';
    html += '<span class="fav-folder-count">' + f.songs.length + ' 首</span>';
    if(i>0) html += '<span class="fav-folder-del" onclick="event.stopPropagation();deleteFolder('+i+')">删除</span>';
    html += '</div>';
    html += '<div class="fav-folder-body" id="favFolderBody'+i+'" style="display:none">';
    if(f.songs.length === 0){
      html += '<p class="fav-empty">暂无歌曲，去搜索里点 ☆ 收藏进来吧</p>';
    } else {
      for(var j=0;j<f.songs.length;j++){
        html += songRowHTML(f.songs[j], i, j);
      }
    }
    html += '</div></div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

    '<button class="download-btn" onclick="doDownload(\'' + escAttr(song.name) + '\',\'' + escAttr(song.singer) + '\',\'' + escAttr(song.quark) + '\')" title="下载">' +

function createFolder(){
  var name = prompt('请输入新收藏夹名称：');
  if(!name || !name.trim()) return;
  favFolders.push({name:name.trim(), songs:[]});
  saveFolders();

function deleteFolder(i){
  if(!confirm('确定删除收藏夹「' + favFolders[i].name + '」及其中的 ' + favFolders[i].songs.length + ' 首歌吗？')) return;
  favFolders.splice(i,1);

}
function removeFromFolder(fi, si){
  favFolders[fi].songs.splice(si,1);

}

function similarSingers(query){
  var qc = cleanStr(query);
  var target = null;
  var keys = Object.keys(songDB);
  for(var i=0;i<keys.length;i++){ if(cleanStr(keys[i])===qc){ target=keys[i]; break; } }
  if(!target) return [];
  var fl = getFL(target);
  var same = [];
  for(var i=0;i<keys.length;i++){ if(keys[i]!==target && getFL(keys[i])===fl) same.push(keys[i]); }
  same.sort(function(a,b){ return (singerPopularity[b]||0)-(singerPopularity[a]||0); });
  return same.slice(0,8);
}
