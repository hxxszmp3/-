<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicFind - 音乐搜索</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f2f6fa;color:#333;min-height:100vh}
.header{background:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8edf2;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#3a7bd5;letter-spacing:1px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#6db3f2,#3a7bd5);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.main{max-width:780px;margin:0 auto;padding:28px 20px 40px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:32px;font-weight:700;color:#3a7bd5;margin-bottom:6px}
.hero p{color:#999;font-size:13px}
.search-mode{display:flex;justify-content:center;gap:0;margin-bottom:18px;background:#fff;border-radius:10px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto;border:1px solid #dce6f0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mode-btn{padding:10px 28px;border:none;background:transparent;color:#999;font-size:14px;cursor:pointer;transition:all .3s;font-weight:500}
.mode-btn.active{background:#3a7bd5;color:#fff;font-weight:600}
.mode-btn:not(.active):hover{color:#3a7bd5;background:#f0f5fb}
.search-box{display:flex;gap:8px;margin-bottom:28px;background:#fff;border-radius:12px;padding:5px;border:2px solid #dce6f0;transition:border-color .3s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.search-box:focus-within{border-color:#3a7bd5;box-shadow:0 2px 12px rgba(58,123,213,.12)}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#333;font-size:15px;padding:13px 16px}
.search-input::placeholder{color:#bbb}
.search-btn{background:linear-gradient(135deg,#6db3f2,#3a7bd5);border:none;color:#fff;padding:13px 26px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:7px}
.search-btn:hover{background:linear-gradient(135deg,#5da3e8,#2d6dc4);transform:translateY(-1px);box-shadow:0 6px 20px rgba(58,123,213,.3)}
.search-btn:active{transform:scale(.97)}
.hint{text-align:center;color:#bbb;font-size:13px;margin-bottom:24px}
.hint span{color:#3a7bd5;font-weight:600;cursor:pointer;transition:opacity .2s}
.hint span:hover{opacity:.7}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.results-count{font-size:13px;color:#999}
.results-count strong{color:#3a7bd5;font-size:15px}
.song-list{display:flex;flex-direction:column;gap:6px}
.song-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:12px 16px;transition:all .25s;border:1px solid #eef3f8;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.song-card:hover{background:#fbfdff;border-color:#d4e2f2;transform:translateX(3px);box-shadow:0 2px 10px rgba(58,123,213,.08)}
.song-index{width:30px;height:30px;border-radius:50%;background:#f0f4f8;display:flex;align-items:center;justify-content:center;font-size:12px;color:#aaa;flex-shrink:0;font-weight:500}
.song-card:nth-child(1) .song-index{background:rgba(58,123,213,.12);color:#3a7bd5;font-weight:700}
.song-card:nth-child(2) .song-index{background:rgba(58,123,213,.08);color:#5b9bd5}
.song-card:nth-child(3) .song-index{background:rgba(58,123,213,.05);color:#6db3f2}
.song-cover{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#e8f0f8,#dce6f0);display:flex;align-items:center;justify-content:center;font-size:22px}
.song-info{flex:1;min-width:0}
.song-name{font-size:15px;font-weight:600;color:#2c3e50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.song-singer{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.download-btn{flex-shrink:0;width:38px;height:38px;border-radius:9px;background:rgba(58,123,213,.06);border:1px solid rgba(58,123,213,.18);color:#3a7bd5;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;position:relative}
.download-btn:hover{background:#3a7bd5;color:#fff;box-shadow:0 4px 14px rgba(58,123,213,.35);transform:scale(1.08)}
.download-btn:active{transform:scale(.93)}
.download-btn svg{width:18px;height:18px}
.download-btn .tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#555;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.download-btn:hover .tooltip{opacity:1}
.empty-state{text-align:center;padding:60px 20px;color:#bbb}
.empty-state .empty-icon{font-size:64px;margin-bottom:14px;opacity:.35}
.empty-state p{font-size:14px}
.loading-wrap{text-align:center;padding:40px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e8edf2;border-top-color:#3a7bd5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#3a7bd5;color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 20px rgba(58,123,213,.3)}
.toast.show{opacity:1}
@media(max-width:600px){
.hero h1{font-size:24px}
.mode-btn{padding:9px 16px;font-size:13px}
.search-input{font-size:14px;padding:11px 12px}
.search-btn{padding:11px 18px;font-size:14px}
.song-card{padding:10px 12px;gap:10px}
.song-cover{width:38px;height:38px;font-size:18px}
.song-name{font-size:14px}
}
</style>
</head>

<main class="main">
  <div class="hero">
    <h1>发现你的音乐</h1>
    <p>歌手搜索 &middot; 歌名搜索</p>
  </div>

  <div class="search-mode">
    <button class="mode-btn active" data-mode="singer" onclick="switchMode(&#x27;singer&#x27;)">&#x1F3A4; 歌手搜索</button>
    <button class="mode-btn" data-mode="song" onclick="switchMode(&#x27;song&#x27;)">&#x1F3B5; 歌名搜索</button>
  </div>

  <div class="search-box">
    <input type="text" class="search-input" id="searchInput"
      placeholder="输入歌手名，如：周杰伦、林俊杰、Taylor Swift..."
      autocomplete="off"

    <button class="search-btn" onclick="doSearch()">

      </svg>
      搜索
    </button>
  </div>

  <p class="hint">
    &#x1F4A1; 试试搜索
    <span onclick="quickSearch(&#x27;周杰伦&#x27;)">周杰伦</span> &middot;
    <span onclick="quickSearch(&#x27;林俊杰&#x27;)">林俊杰</span> &middot;

  </p>

  <div id="resultsContainer"></div>
</main>
<div class="toast" id="toast"></div>

function switchMode(mode) {
  currentMode = mode;
  var btns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  document.querySelector('[data-mode="' + mode + '"]').classList.add('active');
  var input = document.getElementById('searchInput');
  input.placeholder = mode === 'singer'
    ? '输入歌手名，如：周杰伦、林俊杰、Taylor Swift...'
    : '输入歌曲名，如：七里香、晴天、江南...';
  input.value = '';
  input.focus();
}

function quickSearch(name) {
  document.getElementById('searchInput').value = name;
  switchMode('singer');
  doSearch();
}

function doSearch() {
  var query = document.getElementById('searchInput').value.trim();
  if (!query) { showToast('请输入歌手名或歌曲名'); return; }
  var container = document.getElementById('resultsContainer');
  container.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
  setTimeout(function() {
    var results = [];
    if (currentMode === 'singer') {
      var singers = Object.keys(songDB);
      for (var i = 0; i < singers.length; i++) {
        if (singers[i].toLowerCase().indexOf(query.toLowerCase()) !== -1) {
          var songs = songDB[singers[i]];
          for (var j = 0; j < songs.length; j++) {
            results.push({ name: songs[j].name, cover: songs[j].cover, quark: songs[j].quark, singer: singers[i] });
          }
          break;
        }
      }
    } else {
      var q = query.toLowerCase();
      var singerKeys = Object.keys(songDB);
      for (var i = 0; i < singerKeys.length; i++) {
        var singer = singerKeys[i];
        var songs = songDB[singer];
        for (var j = 0; j < songs.length; j++) {
          if (songs[j].name.toLowerCase().indexOf(q) !== -1) {
            results.push({ name: songs[j].name, cover: songs[j].cover, quark: songs[j].quark, singer: singer });
          }
        }
      }
    }
    renderResults(results, query);
  }, 350);
}

function renderResults(results, query) {
  var container = document.getElementById('resultsContainer');
  if (results.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">&#x1F50D;</div>' +
        '<p>未找到「' + escHtml(query) + '」的相关歌曲</p>' +
        '<p style="font-size:12px;color:#444;margin-top:5px;">试试其他关键词吧</p>' +
      '</div>';
    return;
  }
  var modeLabel = currentMode === 'singer'
    ? '&#x1F3A4; 歌手「' + escHtml(results[0].singer) + '」'
    : '&#x1F3B5; 搜索「' + escHtml(query) + '」';
  var html =
    '<div class="results-header">' +
      '<span class="results-count">' + modeLabel + ' &middot; 共 <strong>' + results.length + '</strong> 首</span>' +
    '</div>' +
    '<div class="song-list">';
  for (var i = 0; i < results.length; i++) {
    var song = results[i];
    var num = i < 9 ? '0' + (i + 1) : '' + (i + 1);
    html +=
      '<div class="song-card">' +
        '<div class="song-index">' + num + '</div>' +
        '<div class="song-cover">' + song.cover + '</div>' +
        '<div class="song-info">' +
          '<div class="song-name">' + escHtml(song.name) + '</div>' +
          '<div class="song-singer">' + escHtml(song.singer) + '</div>' +
        '</div>' +
        '<button class="download-btn" onclick="doDownload(\'' + escAttr(song.name) + '\',\'' + escAttr(song.singer) + '\',\'' + escAttr(song.quark) + '\')">' +
          '<span class="tooltip">夸克网盘下载</span>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">' +
            '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
            '<polyline points="7 10 12 15 17 10"/>' +
            '<line x1="12" y1="15" x2="12" y2="3"/>' +
          '</svg>' +
        '</button>' +
      '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function doDownload(name, singer, link) {
  window.open(link, '_blank');
  showToast('&#x1F3A7; 正在跳转夸克网盘：' + singer + ' - ' + name);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

</script>

</body>
</html>
